name: Rinx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Native build and unit tests
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake
      - run: cargo test --locked --features agent_chat --lib
      - run: cargo build --locked --features agent_chat
      - run: cargo check --locked --no-default-features --features agent_chat
      - run: python3 tools/wechat-ux/check_i18n.py
  article-core:
    name: Portable article core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/article-core
      - run: cargo test --locked --manifest-path crates/article-core/Cargo.toml
