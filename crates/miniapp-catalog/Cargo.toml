[package]
name = "rinx-miniapp-catalog"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
description = "Rinx library and compatibility adapter for the shared OctoSense App Hub"

[workspace]

[dependencies]
octosense-app-hub = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "362d832ff66a2d067e1bbcef7d8c25fb9d69740e" }
octosense-app-policy = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub", rev = "362d832ff66a2d067e1bbcef7d8c25fb9d69740e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
