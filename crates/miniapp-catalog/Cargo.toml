[package]
name = "rinx-miniapp-catalog"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
description = "Rinx library and compatibility adapter for the shared OctoSense App Hub"

[workspace]

[dependencies]
octosense-app-hub = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub.git", rev = "b0591e2caa0dc5c62927f7b85dbf826a50618a03" }
octosense-app-policy = { git = "https://github.com/OctoSense-org/OctoSense-App-Hub.git", rev = "b0591e2caa0dc5c62927f7b85dbf826a50618a03" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
